[project]
name = "wildlife-pictures-extraction"
version = "0.1.0"
description = "package that aims at collecting pictures in email to analyse them and store them into the database in order to display them into the web interface"
authors = [
    {name = "Anthony Lelchat",email = "anthony.lelchat@extern.oth-regensburg.de"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mysql-connector-python (>=9.5.0,<10.0.0)",
    "sphinx (>=9.1.0,<10.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "furo (>=2025.12.19,<2026.0.0)",
    "msal (>=1.34.0,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.ocr]
optional = true

[tool.poetry.group.ocr.dependencies]
easyocr = ">=1.7.2,<2.0.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

